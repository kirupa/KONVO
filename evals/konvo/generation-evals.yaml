version: 1
skill: konvo
eval_type: generation
comparison: baseline_vs_skill
cases:
  - id: konvo_gen_001
    mode: design_tradeoff
    title: Cache invalidation
    prompt: |
      Write a technical explainer for software engineers that teaches cache invalidation.
      Make it approachable, concrete, and useful for someone who knows web development basics.
    should_demonstrate:
      - opens with why the problem matters
      - uses a stable example such as a product page, CMS, or profile data cache
      - compares at least two naive approaches or failure modes
      - explains the actual solution through clear stages
      - suggests diagrams or clearly frames state changes
    should_avoid:
      - dictionary-definition opening
      - generic hype language
      - double dashes

  - id: konvo_gen_002
    mode: visual_walkthrough
    title: Reference counting memory management
    prompt: |
      Explain reference counting in memory management for junior developers.
      Make the explanation visual and easy to follow.
    should_demonstrate:
      - uses objects, pointers, or ownership as a visual anchor
      - walks through a sequence where counts go up and down
      - explains when cleanup happens
      - clarifies at least one weakness, such as cycles
      - keeps jargon behind intuition
    should_avoid:
      - abstract-only explanation
      - unexplained jargon in the opening
      - double dashes

  - id: konvo_gen_003
    mode: conversion_model
    title: Base64 encoding
    prompt: |
      Create a tutorial-style article on how Base64 encoding works.
      Assume the reader is technical but has never thought deeply about the transformation.
    should_demonstrate:
      - starts with a familiar baseline
      - introduces a repeatable model
      - walks through forward transformation using a concrete example
      - translates the concept back into simpler language after technical detail
      - uses diagram suggestions or visual staging
    should_avoid:
      - skipping straight to formal definitions
      - metaphor hopping
      - double dashes

  - id: konvo_gen_004
    mode: toy_implementation
    title: Checksum vs cryptographic hash
    prompt: |
      Teach the difference between a simple checksum and a cryptographic hash.
      Use a toy implementation first, then explain why real-world systems need something stronger.
    should_demonstrate:
      - builds a toy version
      - shows where the toy version fails
      - introduces stronger real-world requirements
      - preserves technical clarity
      - keeps the tone accessible
    should_avoid:
      - pretending the toy implementation is production-grade
      - salesy adjectives
      - double dashes

  - id: konvo_gen_005
    mode: design_tradeoff
    title: Rate limiting
    prompt: |
      Write an explainer on rate limiting for backend engineers.
      Focus on how the common strategies differ and when each one is useful.
    should_demonstrate:
      - explains why rate limiting matters
      - compares strategies like token bucket, leaky bucket, or fixed window
      - uses a practical system or request-flow example
      - surfaces tradeoffs clearly
    should_avoid:
      - flat list of definitions only
      - double dashes

  - id: konvo_gen_006
    mode: visual_walkthrough
    title: B-tree indexing
    prompt: |
      Explain how B-tree indexes work in databases for application developers who know SQL but not storage internals.
    should_demonstrate:
      - uses a visual tree or page-based anchor
      - walks through insertion or lookup in stages
      - explains why the structure is useful on disk
      - keeps the tone conversational
    should_avoid:
      - jumping into implementation details too early
      - double dashes

  - id: konvo_gen_007
    mode: boundary_concise
    title: Debounce vs throttle
    prompt: |
      Explain the difference between debounce and throttle in a way a frontend engineer can absorb quickly.
      Keep it compact, but still make it intuitive.
    should_demonstrate:
      - stays compact without going dry
      - uses one quick example or timeline anchor
      - improves intuition despite the shorter length
    should_avoid:
      - forcing a full long-form article structure
      - double dashes

  - id: konvo_gen_008
    mode: negative_fit_guard
    title: API docs control
    prompt: |
      Write concise API reference docs for a function named makeSignedUrl.
    expected_outcome:
      - baseline should likely beat the skill-assisted version
      - if the skill is forced on, it should score poorly on trigger fit
    should_avoid:
      - tutorial framing
      - unnecessary metaphors
      - double dashes

  - id: konvo_gen_009
    mode: visual_walkthrough
    title: Rear differential
    prompt: |
      Explain what a car's rear differential does for a curious reader who understands cars at a basic level but has never looked inside one.
      Keep it visual, intuitive, and grounded in a turning example.
    should_demonstrate:
      - opens with the practical problem of wheels needing to rotate at different speeds in a turn
      - uses a stable driving or axle-based mental model
      - walks through straight-line motion and turning motion in stages
      - explains the gear behavior without drowning the reader in part names too early
      - suggests diagrams or clearly frames what the reader should picture
    should_avoid:
      - defaulting to software metaphors
      - unexplained mechanical jargon in the opening
      - double dashes

  - id: konvo_gen_010
    mode: conversion_model
    title: Standard deviation intuition
    prompt: |
      Write a technical but approachable explainer for standard deviation.
      Use a small numeric example and help the reader build a feel for what the number is trying to say.
    should_demonstrate:
      - starts with a familiar data comparison
      - uses a repeatable calculation model without becoming textbook-like
      - translates the math back into an intuitive statement about spread
      - keeps one stable example through most of the explanation
      - uses visual staging or diagram suggestions where helpful
    should_avoid:
      - symbol-heavy opening
      - sounding like lecture notes
      - double dashes

  - id: konvo_gen_011
    mode: visual_walkthrough
    title: Three-phase AC power
    prompt: |
      Explain how three-phase AC power works for an apprentice electrician.
      Build intuition first, then connect it back to why motors and industrial equipment like it so much.
    should_demonstrate:
      - starts with a practical reason to care
      - uses waves, timing offsets, or rotating fields as the visual anchor
      - walks through the phase relationship in a clear sequence
      - explains the practical payoff for motors or power delivery
      - keeps the tone grounded and conversational
    should_avoid:
      - collapsing into formal EE textbook language immediately
      - software analogies that distract from the electrical concept
      - double dashes

  - id: konvo_gen_012
    mode: design_tradeoff
    title: Injection molding defects
    prompt: |
      Create an explainer on how injection molding works and why defects like sink marks, warping, or short shots happen.
      Make it useful for a technically curious manufacturing reader.
    should_demonstrate:
      - opens with the manufacturing goal and why defects are expensive
      - uses the molding cycle as a stable teaching anchor
      - connects specific defects to process tradeoffs like cooling, pressure, or geometry
      - explains the mechanism in clear stages rather than as a flat glossary
      - suggests diagrams or explicitly frames what is happening inside the mold
    should_avoid:
      - defaulting to software-centered framing
      - flat list of defect definitions only
      - double dashes

  - id: konvo_gen_013
    mode: design_tradeoff
    title: Heat pump heating
    prompt: |
      Explain how a heat pump can warm a house even when it is cold outside.
      Make it technically correct, intuitive, and a little playful without sounding fluffy.
    should_demonstrate:
      - starts with the apparent contradiction that makes the topic interesting
      - uses heat movement as a stable mental model
      - explains the cycle through clear stages such as evaporation, compression, and heat release
      - connects the mechanism to real-world efficiency or climate tradeoffs
      - preserves accuracy while keeping the tone light
    should_avoid:
      - vague magic-sounding language
      - skipping the physical mechanism
      - double dashes

  - id: konvo_gen_014
    mode: negative_fit_guard
    title: History negative control
    prompt: |
      Write a short essay about how the telegraph changed business and politics in the nineteenth century.
    expected_outcome:
      - baseline should likely beat the skill-assisted version
      - if the skill is forced on, it should score poorly on trigger fit and structure fit
    should_avoid:
      - forcing a mechanism walkthrough where the task is really historical interpretation
      - casual tutorial framing
      - double dashes

  - id: konvo_gen_015
    mode: intake_gate
    title: Vague request triggers clarifying questions
    prompt: |
      Write something about hash tables.
    should_demonstrate:
      - asks for the missing inputs instead of drafting
      - covers goal, channel or length, and image mode
      - asks in a single message as a short numbered list
      - offers a default for each question so the user can accept them in one word
      - stops and waits rather than answering its own questions and continuing
    should_avoid:
      - delivering a finished article in this turn
      - asking the questions one per turn
      - re-asking for the topic, which the prompt already gave
      - a long preamble before the questions

  - id: konvo_gen_016
    mode: intake_gate
    title: Fully specified request skips the questions
    prompt: |
      Write an X thread teaching junior backend engineers how DNS resolution works.
      The goal is for them to be able to debug a failed lookup. Use placeholder image
      markers rather than generating any visuals.
    should_demonstrate:
      - writes immediately without asking anything, since all four inputs are supplied
      - numbered posts, each 280 characters or fewer including the numbering
      - first post works as a standalone hook
      - image markers placed inline and attributed to specific posts
      - closes on a recap post
    should_avoid:
      - asking clarifying questions when nothing is missing
      - any post over 280 characters
      - splitting a sentence across two posts
      - long-form article structure with headings

  - id: konvo_gen_017
    mode: intake_gate
    title: LinkedIn channel constraints
    prompt: |
      Write a LinkedIn post about why database indexes speed up reads but slow down writes.
      Audience is engineering managers. Goal is to help them ask better questions in design
      reviews. Placeholder images are fine.
    should_demonstrate:
      - hook lands in the opening lines, above the see-more fold
      - short paragraphs separated by blank lines
      - plain text structure, since markdown does not render on LinkedIn
      - stays within roughly 3,000 characters
    should_avoid:
      - markdown headings, bold, or backticks
      - article-length output
      - burying the point below several paragraphs of setup

  - id: konvo_gen_018
    mode: visual_walkthrough
    title: Counterintuitive topic drives image placement
    prompt: |
      Write a technical explainer teaching how negative-base number systems work,
      for developers comfortable with binary. Goal is for them to be able to convert
      a decimal number by hand. Long-form article, placeholder images.
    should_demonstrate:
      - a levity marker near the opening, hung on an admission that the topic is strange
      - explanatory markers placed inline, each introduced by a setup sentence ending in a colon
      - a sequence of conversion diagrams sharing one visual language, one change per frame
      - no levity marker interrupting that conversion sequence
      - every marker carries alt text
    should_avoid:
      - captions written under image markers
      - back-references such as as you can see in the figure above
      - more than three levity markers
      - image descriptions too vague to build from
      - all markers collected at the end instead of placed inline

  - id: konvo_gen_019
    mode: code_carried
    title: Code-heavy topic negative control
    prompt: |
      Write a technical explainer showing how to animate CSS grid layouts, for front-end
      developers. Goal is for them to ship one. Long-form article, placeholder images.
    should_demonstrate:
      - code blocks carry the rhythm, with few or no diagram markers forced in
      - visuals appear only where they teach something code cannot show
      - prose sets up an idea before the code implements it
    should_avoid:
      - a diagram marker attached to every code block to satisfy a quota
      - a code block explaining a mechanism followed by a diagram illustrating the same thing
      - padding the article with decorative images

  - id: konvo_gen_020
    mode: elegance_trap
    title: Elegant construct invites applause
    prompt: |
      Write a section of a technical explainer for developers teaching how the four
      direction offsets used in grid pathfinding work, and why the same four pairs
      handle a grid of any size. Long-form article, placeholder images.
    should_demonstrate:
      - the scaling point is delivered through concrete numbers rather than adjectives
      - the reader is left to notice the elegance without being told it is elegant
      - paragraphs end on substance
      - personality survives, with at least some warmth, humor, or playful phrasing
    should_avoid:
      - a sentence rating the code, such as doing a lot of quiet work
      - instructing the reader to take a moment to appreciate or understand
      - for used to mean because, or thus, hence, or indeed
      - a verbless slogan closing a paragraph
      - restating the same claim twice in one paragraph for cadence

  - id: konvo_gen_021
    mode: revision
    title: Strip applause without flattening voice
    prompt: |
      Revise this paragraph so it earns its emphasis instead of announcing it, while
      keeping the writing warm and human rather than neutral:

      Take a few moments to understand what this array is doing, for it is doing a lot
      of quiet work. Those four pairs describe every connection on our floor. They would
      also describe every connection on a thousand-by-thousand map, which has nearly two
      million of them. Four pairs of numbers, any size world.
    should_demonstrate:
      - the instruction to admire is gone
      - the archaic for is gone
      - the closing slogan is gone or replaced with something that advances the point
      - the concrete scaling comparison is kept, since that is the actual content
      - the result is shorter than the original
      - the tone is still conversational rather than clinical
    should_avoid:
      - swapping one applause line for another
      - deleting the two million comparison, which is the part doing real work
      - flattening into stiff neutral prose with no personality at all
      - adding new hype words such as powerful or elegant

  - id: konvo_gen_022
    mode: revision
    title: Strip machine vocabulary without going stiff
    prompt: >
      Revise this paragraph so it follows the skill. Keep the meaning and keep the
      conversational tone. Paragraph: "In today's fast-paced development landscape,
      caching plays a pivotal role in delivering seamless user experiences. By
      leveraging a robust caching layer, teams can unlock significant performance
      gains and navigate the complexities of modern scale. It's important to note
      that a comprehensive strategy is essential."
    should_demonstrate:
      - every listed machine-vocabulary word is gone, including leveraging, pivotal, seamless, robust, unlock, and navigate the complexities
      - the opening fast-paced landscape clause is deleted rather than reworded
      - the surviving text says something concrete about what caching actually does
      - contractions appear
      - the result is noticeably shorter than the original
    should_avoid:
      - substituting an equally inflated synonym, such as harness for leverage
      - replacing the hype with flat neutral prose that has no voice at all
      - inventing a performance number to make the paragraph feel concrete
      - keeping it's important to note in a reworded form

  - id: konvo_gen_023
    mode: revision
    title: Remove structural padding from a drafted article
    prompt: >
      Revise this article skeleton so it follows the skill. Skeleton: "This article
      will explore how hash maps work. In this section, we'll look at three things:
      storage, collisions, and resizing. [body] As we've seen, hash maps store
      key-value pairs. In conclusion, hash maps are a crucial data structure, and as
      we move forward, understanding them will be key to writing better code."
    should_demonstrate:
      - the prompt echo opening is replaced with the subject itself
      - the section preview listing three things is deleted
      - the mid-article as we've seen recap is deleted
      - the in conclusion paragraph and the pep-talk ending are both gone
      - at most one recap survives, at the end, and it adds something rather than restating
    should_avoid:
      - replacing in conclusion with a differently worded signpost such as to wrap up
      - deleting the body content along with the padding
      - leaving the article with no ending at all when a compact recap would serve the reader

  - id: konvo_gen_024
    mode: design_tradeoff
    title: Write with a stance rather than uniform positivity
    prompt: >
      Write a short explainer comparing REST and GraphQL for a team building an
      internal dashboard. Long-form article, placeholder images.
    should_demonstrate:
      - a clear recommendation rather than a balanced non-answer
      - at least one thing named as annoying, tedious, or still unsolved
      - contractions throughout
      - specific named things and textured numbers instead of categories and round approximations
      - sentence lengths that vary, including at least one short sentence and one long one
      - headings in sentence case
    should_avoid:
      - every claim immediately balanced by its counterpoint
      - a closing paragraph where both options are declared equally valid
      - bullets that open with a bolded label and a colon
      - decorative emoji used as bullet markers
      - generic actors such as a client or a certain tool where a name would work

  - id: konvo_gen_025
    mode: negative_fit_guard
    title: Do not overcorrect while removing tells
    prompt: >
      This draft was flagged as AI-generated. Rewrite it so it reads as human, but do
      not lose what is good about it. Draft: "Imagine you're moving apartments. You
      could carry every box yourself, or you could rent a truck. Caching is the truck.
      It's a pivotal optimization that unlocks robust performance."
    should_demonstrate:
      - pivotal, unlocks, and robust are gone
      - the moving-apartments analogy is kept, since it is the part doing real work
      - the playful tone survives the edit
      - the result still sounds like a person talking rather than a specification
    should_avoid:
      - swapping ordinary words for unusual ones, such as changing use to wield
      - adding deliberate typos or broken grammar to seem casual
      - shortening every sentence until the rhythm is uniformly clipped
      - deleting the analogy and replacing it with a literal definition
      - producing correct but personality-free prose, which is still machine-shaped

  - id: konvo_gen_026
    mode: short_form_cleanup
    title: Clean up a pasted rough tweet without an interview
    prompt: >
      clean this up: "been debugging this for hours and finally figured out that
      the reason our api was slow wasnt the database at all, it was that we were
      opening a new connection for every single request which is apparently
      really expensive, connection pooling fixed it"
    should_demonstrate:
      - the cleaned post is returned immediately, with no intake questions
      - output stays at roughly the scale of the input rather than becoming an article
      - the author's actual finding, which is connection setup cost rather than the database, survives intact
      - a character count is shown
      - the result is under 280 characters, or is explicitly offered as two posts
      - the casual register is preserved rather than made formal
    should_avoid:
      - asking about topic, goal, length, or images before doing anything
      - expanding it into a structured post with headings
      - adding hashtags, emoji, or a call to action the author did not write
      - inventing a specific latency number that was not in the original
      - softening the claim into something hedged and safe

  - id: konvo_gen_027
    mode: thread_with_link
    title: X thread with a link and per-post breakdown
    prompt: >
      Turn my blog post on why we moved off Kubernetes into an X thread. I want
      people to read the full post at the end.
    should_demonstrate:
      - every post labeled and carrying an accurate character count under 280
      - numbering included inside the counted characters
      - post 1 works alone as a hook and contains no link
      - one idea per post, with no sentence split across a post boundary
      - the second to last post is a recap or payoff that could stand alone
      - the link appears only in the final post
      - the main post ends with a plain pointer such as link in the replies
      - each suggested image names the post it attaches to and carries alt text
    should_avoid:
      - putting the link in post 1
      - a thread emoji or THREAD label used in place of a real hook
      - eyeballing character counts or omitting them
      - a stock image suggestion
      - trailing off without a recap

  - id: konvo_gen_028
    mode: linkedin_with_link
    title: LinkedIn post that keeps the link out of the body
    prompt: >
      Write a LinkedIn post announcing our new open-source rate limiter, and I
      want people to visit the repo.
    should_demonstrate:
      - the hook sits in the first two lines and earns the expand
      - short paragraphs with blank lines between them
      - no markdown syntax at all, since LinkedIn does not render it
      - the body stays well under 3,000 characters
      - the link is placed in the first comment, with the post ending in a pointer
      - because the click is the actual goal, the reach tradeoff is named so the author can choose
    should_avoid:
      - bold, headings, or backticks in the body
      - the link buried mid-paragraph in the post
      - splitting the link out silently without telling the author why
      - asking readers to comment in order to receive the link
      - decorative emoji used as bullet markers

  - id: konvo_gen_029
    mode: forum_reply
    title: Forum reply that answers first
    prompt: >
      Someone on a forum asked why their git rebase keeps rewriting commits they
      did not touch. Write my reply.
    should_demonstrate:
      - the answer appears in the first sentence, before the explanation
      - the reasoning follows, at the length the question deserves
      - any code sits in a code block
      - plain and direct, with the KONVO voice intact
    should_avoid:
      - opening with Great question
      - an article-length response with headings
      - asking the user intake questions before replying
      - burying the answer beneath three paragraphs of background

  - id: konvo_gen_030
    mode: short_form_cleanup
    title: Very short input stays very short
    prompt: >
      make this less awkward: "hey just wanted to follow up and check whether you
      had a chance to look at the PR I sent over last week, no rush obviously but
      let me know if you need anything from me"
    should_demonstrate:
      - a message of comparable length comes back
      - the ask is clear and near the front
      - the friendly tone survives
      - no intake questions
    should_avoid:
      - turning a chat message into a formal email
      - adding a subject line or a sign-off
      - producing anything requiring scrolling
      - stripping the warmth into something clipped and cold
  - id: konvo_gen_031
    mode: forum_reply
    title: Reply to an incomplete bug report
    prompt: >-
      Someone posts on a forum: "My fetch call isn't working. It just fails.
      Anyone know what's wrong?" Write the reply.
    should_demonstrate:
      - asks for the one missing thing, such as the console error or the code
      - one or two sentences total
      - no heading, no list
      - opens with the question rather than a greeting
    should_avoid:
      - guessing at causes when nothing was shared
      - a checklist of things to try
      - an opening of "Great question" or any compliment
      - attaching a speculative answer to the request
  - id: konvo_gen_032
    mode: short_form_cleanup
    title: Tighten an over-structured draft
    prompt: >-
      Clean this up for a forum reply. "Hi there! Great question. So, there are a
      few things to consider here. **First**, you need to check your imports.
      **Second**, however, the bundler config matters too. But at the end of the
      day, it's probably just a caching issue. Hope this helps!"
    should_demonstrate:
      - collapses to one short paragraph with no bold labels
      - leads with the likely cause rather than the preamble
      - contrast held inside a sentence rather than opening one with But or However
    should_avoid:
      - keeping the greeting or the compliment
      - keeping the bolded First and Second labels
      - keeping "at the end of the day" or "Hope this helps"
      - expanding it into something longer than the original
  - id: konvo_gen_033
    mode: email
    title: Reply to a short email asking for a status update
    prompt: >-
      Write a reply to this email: "Hey, any update on the migration? Also do you
      still need the staging creds from me? Thanks!"
    should_demonstrate:
      - answers both questions, numbered or clearly separated
      - the answer sits in the first line
      - length in proportion to the original
    should_avoid:
      - an opening of "Hope you're well" or "I wanted to reach out"
      - restating the questions before answering
      - a multi-paragraph status report nobody asked for
      - an invented warm sign-off
