version: 1
skill: konvo
eval_type: regression
checks:
  - id: konvo_reg_001
    name: no_double_dashes
    priority: high
    description: Output should not use double dashes as interruption or emphasis punctuation.
    failure_signals:
      - contains the literal token "--" in body prose
    preferred_fix:
      - replace with a comma
      - split into a shorter sentence

  - id: konvo_reg_002
    name: intuition_before_jargon
    priority: high
    description: The opening should not begin with dense terminology before the reader has a foothold.
    failure_signals:
      - first paragraph is mostly definition language
      - formal terms appear before any plain-language framing

  - id: konvo_reg_003
    name: stable_teaching_anchor
    priority: high
    description: The explanation should have one stable teaching anchor where appropriate.
    failure_signals:
      - example appears once and disappears
      - multiple unrelated metaphors compete for attention

  - id: konvo_reg_004
    name: visual_support_present
    priority: medium
    description: Long explainers should show visual thinking through diagrams or explicit image directions.
    failure_signals:
      - no diagram guidance in a clearly visual topic
      - several state changes happen with no visual framing

  - id: konvo_reg_005
    name: no_hype_voice
    priority: high
    description: The tone should be energetic without sounding like marketing copy.
    failure_signals:
      - overuse of words like revolutionary, game-changing, or groundbreaking
      - grandiose praise without explanation

  - id: konvo_reg_006
    name: no_forced_tradeoff_section
    priority: medium
    description: The skill should not force rejected alternatives into topics that do not benefit from them.
    failure_signals:
      - awkward or artificial "failed approaches" section in a straightforward model tutorial
      - comparison section that does not teach anything meaningful

  - id: konvo_reg_007
    name: technical_precision_preserved
    priority: high
    description: Accessibility should not come at the cost of correctness.
    failure_signals:
      - oversimplification creates a false mental model
      - critical dependencies or caveats are omitted

  - id: konvo_reg_008
    name: domain_native_framing
    priority: high
    description: Non-computer topics should stay grounded in their own domain instead of being dragged back into software examples or developer language.
    failure_signals:
      - a mechanical, electrical, math, or manufacturing prompt gets reframed around apps, APIs, or backend systems
      - software metaphors replace clearer domain-native examples
      - the explanation sounds like a coder talking about code instead of the requested subject

  - id: konvo_reg_009
    name: intake_gate_respected
    priority: high
    description: A vague request should produce clarifying questions, not a full draft written against guessed constraints.
    failure_signals:
      - a complete article is delivered when topic, goal, channel, or image mode were never specified
      - the channel is assumed to be long-form without asking
      - image mode is assumed without asking
      - questions are asked but a full draft is delivered in the same turn anyway
    preferred_fix:
      - ask only for the missing inputs, in one message, with defaults offered
      - stop and wait for the answer before drafting

  - id: konvo_reg_010
    name: intake_not_over_asked
    priority: medium
    description: The gate should not re-ask for details the prompt already supplied, and should not spread questions across turns.
    failure_signals:
      - asks for the topic when the prompt already names it
      - asks the four questions one per turn instead of together
      - asks clarifying questions after the user explicitly said to skip them and write
      - no defaults offered, forcing the user to answer every question manually

  - id: konvo_reg_011
    name: channel_limits_respected
    priority: high
    description: Output must obey the constraints of the channel it was written for.
    failure_signals:
      - an X thread post exceeds 280 characters including its numbering
      - a sentence is split across two posts in a thread
      - thread posts are unnumbered
      - a LinkedIn post uses markdown headings, bold, or backticks, none of which render there
      - a LinkedIn post buries the hook below the first couple of lines
    preferred_fix:
      - count characters per post rather than estimating
      - move the hook into the opening lines
      - replace markdown structure with line breaks and plain capitalized labels

  - id: konvo_reg_012
    name: image_mode_honored
    priority: high
    description: The answer to the image question should visibly change the output.
    failure_signals:
      - placeholder mode was chosen but images are described only vaguely in prose instead of called out as markers
      - generate mode was chosen but only markers were produced, with no explanation of why generation was skipped
      - image callouts are collected at the end instead of placed inline where each image belongs

  - id: konvo_reg_013
    name: images_are_introduced
    priority: high
    description: No image arrives unannounced. The sentence before it says something is about to be shown.
    failure_signals:
      - an image marker with no lead-in sentence
      - the lead-in sentence describes the image rather than pointing at it
      - a marker dropped between two unrelated paragraphs with no connective setup
    preferred_fix:
      - add a short declarative setup sentence, usually ending in a colon
      - if no honest setup can be written, the image is probably not needed

  - id: konvo_reg_014
    name: no_captions_or_backreferences
    priority: medium
    description: The setup sentence does the caption's job, so the space under an image stays empty and prose does not narrate the image back.
    failure_signals:
      - an italic or bold caption line directly under an image marker
      - an "as you can see in the figure above" back-reference, or any equivalent
      - the paragraph after an image restates what the image already showed
    preferred_fix:
      - delete the caption and fold anything load-bearing into the setup sentence
      - have the following paragraph build on the image rather than recap it

  - id: konvo_reg_015
    name: levity_budget_and_placement
    priority: high
    description: Levity is rationed and front-weighted, and never interrupts a sequence the reader is tracking.
    failure_signals:
      - four or more levity markers in one article
      - a levity marker between two steps of a numbered or sequential walkthrough
      - no levity marker anywhere near the opening on a topic the article itself calls strange
      - every levity marker clustered at the conclusion
    preferred_fix:
      - move the first gag up to the sentence conceding the topic is odd
      - cut down to three or fewer, keeping the earliest ones

  - id: konvo_reg_016
    name: markers_are_buildable
    priority: high
    description: An image marker should be executable by a designer or image model without a follow-up question.
    failure_signals:
      - a marker that only names a subject, such as a picture of the algorithm working
      - a marker in a sequence that does not say what changed from the previous frame
      - a marker with no alt text
      - markers collected at the end of the draft instead of placed inline
    preferred_fix:
      - state the scene, what is labeled, and the single thing that changed
      - carry the same viewpoint and visual language across a sequence

  - id: konvo_reg_017
    name: visual_rhythm_and_order
    priority: medium
    description: Something breaks the column regularly, and visuals precede the code that implements them.
    failure_signals:
      - four or more consecutive prose-only paragraphs with no image, code block, or table
      - a code block explaining a mechanism followed by a diagram illustrating the same thing
      - diagrams forced into a code-carried article that was already well paced
    preferred_fix:
      - treat code blocks and tables as legitimate rhythm breaks
      - reorder to prose, then image, then code

  - id: konvo_reg_018
    name: no_applause_lines
    priority: high
    description: No sentence exists only to signal that the nearby idea is clever. Deleting it should cost the reader information, not just admiration.
    failure_signals:
      - a sentence rating the content, such as this is doing a lot of quiet work, or this is deceptively powerful
      - the reader is instructed to appreciate, admire, or sit with something
      - a lead-in asking the reader to take a moment to understand, with nothing specific named to look at
      - an insight announcer in wording not on the blocklist, which is the same failure in new clothes
    preferred_fix:
      - delete the sentence and let the demonstration carry it
      - if the point is genuinely important, replace the adjective with the concrete fact that makes it important
      - keep brief reactions such as neat, right?, which land after the demonstration rather than before it

  - id: konvo_reg_019
    name: no_slogan_closers
    priority: medium
    description: Paragraphs end on substance, not on a compressed restatement parked there for cadence.
    failure_signals:
      - a verbless fragment closing a paragraph, such as four pairs of numbers, any size world
      - a paragraph that opens with a claim and closes with the same claim as a slogan
      - several paragraphs in a row ending on a punchy fragment
    preferred_fix:
      - cut the fragment when the paragraph already made the point
      - keep at most one such closer in a long article, at a genuine turning point

  - id: konvo_reg_020
    name: register_stays_spoken
    priority: medium
    description: The prose stays in the register of a person explaining something out loud, without reaching for literary gravitas.
    failure_signals:
      - for used to mean because
      - thus, hence, indeed, or one might say
      - personification as decoration, such as an array doing quiet work
      - a sentence that would sound absurd said out loud to a coworker
    preferred_fix:
      - use because, so, or a second sentence
      - read the sentence aloud and keep the version a person would actually say

  - id: konvo_reg_021
    name: voice_not_flattened
    priority: high
    description: Cutting applause must not cut personality. Guards against over-correcting into neutral prose.
    failure_signals:
      - no humor, asides, or exaggeration anywhere in a long article
      - every sentence the same measured length and shape
      - all direct reader address removed, including the useful kind that requests a specific mental action
      - a ghost-written piece with the author's pet phrases and hedges sanded off
    preferred_fix:
      - restore jokes, asides, and playful parentheticals, which add something an applause line does not
      - keep imagine we are building and take a mental snapshot of these values, which ask for an action rather than a mood

  - id: konvo_reg_022
    name: no_machine_vocabulary
    priority: high
    description: The high-frequency generated-text vocabulary must not appear unless the literal meaning is required.
    failure_signals:
      - verbs such as delve, leverage, utilize, harness, foster, streamline, unlock, or showcase
      - nouns such as tapestry, realm, landscape, ecosystem, paradigm, journey, or intricacies used figuratively
      - adjectives such as pivotal, crucial, seamless, robust, intricate, nuanced, or transformative
      - stock phrases such as in today's fast-paced world, it's important to note, at its core, or when it comes to
      - three or more of the allowed-alone words such as comprehensive, key, powerful, or quietly stacked in a single sentence
    preferred_fix:
      - use the plain verb, so utilize becomes use and leverage becomes use
      - keep literal uses, since an ecosystem that lost its otters is a real ecosystem
      - delete the adjective rather than replacing it with a fancier one

  - id: konvo_reg_023
    name: no_structural_padding
    priority: high
    description: Previews, recaps, conclusions, and prompt echoes that carry no information must not appear.
    failure_signals:
      - a section preview such as in this section we'll look at three things
      - a mid-article recap such as as we've seen
      - a paragraph opening with in conclusion, in summary, or overall
      - a closing pep talk such as as we move forward, embracing these patterns will be key
      - a prompt echo such as this article will explore how hash maps work
      - the first reason is, the second reason is, the third reason is, where the ideas actually connect
    preferred_fix:
      - keep exactly one recap, at the end, as described under End With a Compact Recap
      - end on the last concrete point instead of announcing the ending
      - open with the thing itself rather than a description of the article

  - id: konvo_reg_024
    name: no_empty_negative_parallelism
    priority: medium
    description: The it's not X, it's Y construction must carry a real contrast rather than supply cadence.
    failure_signals:
      - both halves are abstractions, as in it's not about speed, it's about clarity
      - deleting the first half would lose no information
      - the construction appears more than once in a single article
      - over-simplified openers such as most people think or we've all been there
    preferred_fix:
      - state the second half directly and delete the setup
      - keep the construction when both halves are concrete and the contrast is doing work

  - id: konvo_reg_025
    name: formatting_not_machine_shaped
    priority: medium
    description: Article formatting must not carry the visual signature of generated output.
    failure_signals:
      - bullets opening with a bolded label and a colon, such as Security: it matters
      - decorative emoji used as bullet markers or heading ornaments
      - headings in Title Case, or colon-split titles such as The power of caching: why it works
      - curly quotes or unrendered markdown in plain-text channels
      - a semicolon where a period would read better
    preferred_fix:
      - write each bullet as a sentence
      - use sentence case for headings
      - keep emoji only where the author's own voice or the channel already uses them

  - id: konvo_reg_026
    name: register_and_stance_intact
    priority: high
    description: Prose must keep contractions, specifics, and a point of view rather than defaulting to formal, uniformly positive text.
    failure_signals:
      - no contractions anywhere in a long article
      - every claim immediately balanced by its counterpoint
      - nothing in the piece is criticized, tedious, or unresolved
      - generic actors such as a client, a certain tool, or a major city where a name would work
      - invented character names defaulting to Emily or Sarah
      - an anecdote with no detail that fails to serve the point
    preferred_fix:
      - restore contractions such as don't, you'll, and here's
      - name at least one thing that is annoying, tedious, or still unsolved
      - replace category words with specific named things and textured numbers such as v2 or 11 months

  - id: konvo_reg_027
    name: no_leaked_machinery
    priority: high
    description: Assistant scaffolding and fabricated support must never reach the output.
    failure_signals:
      - conversational scaffolding such as Certainly! Here's the article or I hope this helps
      - self-reference such as as an AI language model, or a mention of a knowledge cutoff
      - unfilled placeholders such as insert example here
      - tracking parameters such as utm_source on a link
      - invented citations, statistics, benchmarks, or quotes
      - Best regards or a similar sign-off outside an actual email
    preferred_fix:
      - deliver the article body alone, with no preamble and no offer to revise
      - omit the number entirely when no real number is available
      - keep the deliberate Diagram and Levity markers, which are output rather than placeholders

  - id: konvo_reg_028
    name: short_form_scale_respected
    priority: high
    description: Short input and short-form channels must produce short output rather than an article.
    failure_signals:
      - a pasted two-line message comes back as a structured post with headings
      - a request to tighten a tweet returns several paragraphs
      - a chat or text message reply that needs scrolling
      - section headings appearing in an X post, a LinkedIn post, or a text message
      - a thread of three posts that would have worked as one post
    preferred_fix:
      - return output at the scale of the input
      - collapse a thread shorter than four posts into a single post and say so

  - id: konvo_reg_029
    name: cleanup_skips_the_interview
    priority: high
    description: Pasted drafts must be cleaned up directly rather than triggering the four intake questions.
    failure_signals:
      - asking topic, goal, length, and image questions about a two-sentence message the user already wrote
      - refusing to start until the channel is confirmed when the pasted text makes it obvious
      - more than one clarifying question on a short cleanup
      - the author's claim softened or hedged during cleanup
      - a cleanup that shares almost no vocabulary with the original
    preferred_fix:
      - treat the pasted draft as the brief, since topic and goal are already in it
      - return the cleaned version first in a copyable block, with at most two lines about what changed

  - id: konvo_reg_030
    name: character_counts_shown_and_honest
    priority: high
    description: Every short-form piece must carry a character count, and every count must be under the channel limit.
    failure_signals:
      - thread posts delivered with no character counts
      - a stated count that does not match the actual text
      - any X post over 280 characters on a free account
      - numbering such as 3/9 omitted from the count
      - a LinkedIn post over roughly 3,000 characters
    preferred_fix:
      - count the characters rather than estimating them
      - include the numbering prefix in the count
      - cut content rather than shipping a post that cannot be published

  - id: konvo_reg_031
    name: hook_carries_information
    priority: high
    description: The first line must say something concrete rather than announce the subject.
    failure_signals:
      - openers such as let's talk about caching or a thread on DNS
      - claims nobody would argue with, such as testing is important
      - the unfalsifiable crowd claim, such as most developers get this wrong
      - rhetorical questions with obvious answers
      - a thread emoji or THREAD label carrying the weight a sentence should carry
      - a hook that would sit equally well above a completely different post
    preferred_fix:
      - lead with a specific failure, a correction, a surprising result, a cost, or a question the reader has actually asked
      - name who gets it wrong and how, rather than gesturing at most people

  - id: konvo_reg_032
    name: links_placed_in_followup
    priority: medium
    description: External links belong in a reply or first comment rather than the main post.
    failure_signals:
      - an external link inside the main X post or LinkedIn post body
      - no pointer such as link in the replies or link in the comments
      - splitting the link out silently when the link is the entire point of the post
      - asking readers to comment or DM in order to receive the link
      - media linked from elsewhere rather than uploaded to the platform
    preferred_fix:
      - put the link in the final thread post or the first comment
      - name the tradeoff and let the author choose when the post exists to drive the click

  - id: konvo_reg_033
    name: social_media_earns_its_place
    priority: medium
    description: Images and video in short-form must carry information rather than decorate.
    failure_signals:
      - a stock photo suggested for a technical post
      - four images where one diagram would do
      - an image suggested in a thread without naming which post it attaches to
      - video proposed for a static diagram with no motion or sequence
      - missing alt text
      - a visual requirement invented during a cleanup the author never asked to illustrate
    preferred_fix:
      - prefer a diagram, then a marked-up screenshot, then a short video where something changes
      - attach each image to a named post and write its alt text
